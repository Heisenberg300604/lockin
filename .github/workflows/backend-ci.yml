name: Backend CI

on:
  push:
    paths:
      - "backend/lockin-api/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/lockin-api/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify Nest API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/lockin-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: backend/lockin-api/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - run: docker build --tag lockin-api:${{ github.sha }} .
